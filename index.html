<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Aloha Maids — End of Shift Report</title>
<style>
  :root{
    --deep-blue:#1e4b8f;
    --royal-blue:#2f6fca;
    --sky-blue:#5fb8dd;
    --light-blue:#eaf6fb;
    --white:#ffffff;
    --ink:#1c2b3a;
    --muted:#5b7186;
    --success:#2e9e5b;
    --shadow: 0 10px 30px rgba(30,75,143,0.12);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--light-blue) 0%, #ffffff 45%);
    color: var(--ink);
    min-height:100vh;
    padding-bottom: 60px;
  }

  header.hero{
    position:relative;
    text-align:center;
    padding: 44px 20px 70px;
    overflow:hidden;
  }
  .badge{
    display:inline-block;
    font-size:11px;
    letter-spacing:1.5px;
    font-weight:700;
    color:var(--royal-blue);
    background: rgba(95,184,221,0.15);
    border:1px solid rgba(95,184,221,0.35);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .logo-word{
    font-size: clamp(34px, 7vw, 54px);
    font-weight:900;
    letter-spacing:1px;
    line-height:1;
    margin:0;
  }
  .logo-word .aloha{ color: var(--sky-blue); }
  .logo-word .maids{ color: var(--deep-blue); }
  .tagline{
    margin-top:8px;
    font-size:15px;
    color:var(--muted);
    font-style:italic;
  }
  .subtitle{
    margin-top:18px;
    font-size:20px;
    font-weight:700;
    color:var(--ink);
  }
  .wave{
    position:absolute;
    bottom:0; left:0; right:0;
    width:100%;
    height:50px;
    line-height:0;
  }

  main{
    max-width: 760px;
    margin: -30px auto 0;
    padding: 0 20px;
    position:relative;
    z-index:2;
  }

  .card{
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    border: 1px solid rgba(30,75,143,0.06);
  }

  .field-row{ margin-bottom: 22px; }
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color: var(--deep-blue);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:8px;
  }
  input[type="text"], input[type="date"], select{
    width:100%;
    padding:14px 16px;
    font-size:16px;
    border-radius:10px;
    border:1.5px solid #d7e6f0;
    background:#fbfdff;
    color:var(--ink);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e4b8f' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
    background-repeat:no-repeat;
    background-position: right 16px center;
    background-size:18px;
    padding-right:44px;
    cursor:pointer;
  }
  select:invalid{ color:#8a9bab; }
  input[type="text"]:focus, input[type="date"]:focus, select:focus{
    border-color: var(--sky-blue);
    box-shadow: 0 0 0 3px rgba(95,184,221,0.25);
  }

  .stats-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 8px;
  }
  @media (max-width:560px){
    .stats-grid{ grid-template-columns: 1fr; }
  }
  .stat-field{
    background: var(--light-blue);
    border:1.5px solid #d7ecf5;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-field label{
    color: var(--ink);
    font-size:12px;
    margin-bottom:10px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:36px; height:36px;
    border-radius:8px;
    border:none;
    background: var(--royal-blue);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    flex:0 0 auto;
    transition: background .15s ease, transform .1s ease;
  }
  .stepper button:active{ transform: scale(0.94); }
  .stepper button:hover{ background: var(--deep-blue); }
  .stepper input[type="number"]{
    flex:1 1 auto;
    width:100%;
    min-width:0;
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:var(--deep-blue);
    padding:8px 6px;
    border-radius:8px;
    border:1.5px solid #cfe4ee;
    background:#fff;
    -moz-appearance: textfield;
  }
  .stepper input[type="number"]::-webkit-outer-spin-button,
  .stepper input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .stepper input[type="number"]:focus{
    outline:none;
    border-color: var(--sky-blue);
    box-shadow: 0 0 0 3px rgba(95,184,221,0.25);
  }

  .submit-btn{
    width:100%;
    margin-top: 10px;
    padding: 16px;
    font-size:17px;
    font-weight:800;
    letter-spacing:0.3px;
    color:#fff;
    background: linear-gradient(135deg, var(--sky-blue), var(--royal-blue));
    border:none;
    border-radius: 12px;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(47,111,202,0.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .submit-btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 24px rgba(47,111,202,0.45); }
  .submit-btn:active{ transform: translateY(0); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .spinner{
    display:inline-block;
    width:16px; height:16px;
    border:2.5px solid rgba(255,255,255,0.45);
    border-top-color:#fff;
    border-radius:50%;
    vertical-align:middle;
    margin-right:8px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-text{
    color:#c0392b;
    font-size:13px;
    font-weight:600;
    margin-top:8px;
    display:none;
  }
  .submit-error{
    color:#c0392b;
    font-size:13px;
    font-weight:600;
    margin-top:12px;
    text-align:center;
    display:none;
  }

  .confirm-panel{
    display:none;
    text-align:center;
    padding: 40px 20px;
  }
  .thankyou-icon{
    font-size:56px;
    line-height:1;
    margin-bottom:14px;
  }
  .confirm-title{
    font-size:22px;
    font-weight:800;
    color: var(--deep-blue);
    margin-bottom:6px;
  }
  .confirm-sub{
    color: var(--muted);
    font-size:14px;
    margin-bottom:22px;
  }
  .summary-table{
    text-align:left;
    width:100%;
    border-collapse:collapse;
    margin-bottom:24px;
    font-size:14px;
  }
  .summary-table td{
    padding:8px 10px;
    border-bottom:1px solid #eef3f7;
  }
  .summary-table td:first-child{ color: var(--muted); font-weight:600; }
  .summary-table td:last-child{ text-align:right; font-weight:700; color:var(--ink); }

  .action-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn-secondary{
    padding: 11px 18px;
    font-size:14px;
    font-weight:700;
    border-radius:10px;
    border:1.5px solid var(--royal-blue);
    background:#fff;
    color: var(--royal-blue);
    cursor:pointer;
  }
  .btn-secondary:hover{ background: var(--light-blue); }

  footer{
    text-align:center;
    color: var(--muted);
    font-size:12px;
    margin-top: 26px;
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(20,35,55,0.55);
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 10;
  }
  .modal-card{
    background:#fff;
    border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 30px;
    width:100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y:auto;
  }
  .modal-title{
    font-size:19px;
    font-weight:800;
    color: var(--deep-blue);
    margin-bottom:4px;
    text-align:center;
  }
  .modal-name{
    text-align:center;
    color: var(--muted);
    font-size:14px;
    font-weight:600;
    margin-bottom:20px;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .modal-actions .btn-secondary{
    flex:1;
    padding:14px;
  }
  .modal-actions .submit-btn{
    flex:1;
    margin-top:0;
  }
</style>
</head>
<body>

<header class="hero">
  <span class="badge">Internal Tool</span>
  <h1 class="logo-word"><span class="aloha">ALOHA</span> <span class="maids">MAIDS</span></h1>
  <div class="tagline">referral agency</div>
  <div class="subtitle">End of Shift Report</div>

  <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,32 C240,60 480,0 720,20 C960,40 1200,60 1440,24 L1440,60 L0,60 Z" fill="#5fb8dd" opacity="0.35"></path>
    <path d="M0,44 C240,20 480,60 720,40 C960,20 1200,10 1440,40 L1440,60 L0,60 Z" fill="#ffffff"></path>
  </svg>
</header>

<main>
  <div class="card">

    <form id="eosForm">
      <div class="field-row">
        <label for="repName">Name</label>
        <select id="repName" name="repName" required>
          <option value="" disabled selected>Select Your Name</option>
          <option value="Angel Labor">Angel Labor</option>
          <option value="Christy Soquillo">Christy Soquillo</option>
          <option value="Liza Cohitmingao">Liza Cohitmingao</option>
          <option value="Lovely Mariz Quirol">Lovely Mariz Quirol</option>
          <option value="Chel Abanales">Chel Abanales</option>
        </select>
        <div class="error-text" id="nameError">Please select your name.</div>
      </div>

      <div class="field-row">
        <label for="shiftDate">Shift Date</label>
        <input type="date" id="shiftDate" name="shiftDate" required />
        <div class="error-text" id="dateError">Please select the shift date.</div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit my EOS Report</button>
      <div class="submit-error" id="submitError"></div>
    </form>

    <div class="confirm-panel" id="confirmPanel">
      <div class="thankyou-icon">🌺</div>
      <div class="confirm-title">Mahalo!</div>
      <div class="confirm-sub">Thank you for your hard work and for submitting the report.</div>

      <div class="action-row">
        <button class="btn-secondary" id="newReportBtn" type="button">Submit Another Report</button>
      </div>
    </div>

  </div>

  <footer>Aloha Maids &middot; alohamaids.com &middot; Internal use only</footer>
</main>

<div class="modal-overlay" id="reviewModal">
  <div class="modal-card">
    <div class="modal-title">Please Review Your Summary</div>
    <div class="modal-name" id="reviewName"></div>

    <table class="summary-table" id="reviewTable"></table>

    <div class="submit-error" id="modalSubmitError"></div>

    <div class="modal-actions">
      <button class="btn-secondary" id="goBackBtn" type="button">Go Back</button>
      <button class="submit-btn" id="confirmSubmitBtn" type="button">
        <span class="spinner" id="submitSpinner" style="display:none;"></span><span id="submitBtnText">Submit</span>
      </button>
    </div>
  </div>
</div>

<script>
  const FIELDS = [
    { key: "receivedCalls", label: "Received Calls" },
    { key: "outboundCalls", label: "Outbound Calls" },
    { key: "bookingByStaff", label: "Booking by Staff" },
    { key: "bookingOnline", label: "Booking Online" },
    { key: "bookingByCustomer", label: "Booking by Customer" },
    { key: "emailQuoteSent", label: "Email Quote Sent" },
    { key: "marketingRobo", label: "Marketing/Robo" },
    { key: "textBrigade", label: "Text Brigade" },
    { key: "quoteFormLead", label: "Quote Form Lead" },
    { key: "newRecurring", label: "New Recurring" },
  ];

  const statsGrid = document.getElementById("statsGrid");
  FIELDS.forEach(f => {
    const wrap = document.createElement("div");
    wrap.className = "stat-field";
    wrap.innerHTML = `
      <label for="${f.key}">${f.label}</label>
      <div class="stepper">
        <button type="button" data-action="dec" data-target="${f.key}" aria-label="decrease">−</button>
        <input type="number" id="${f.key}" name="${f.key}" min="0" step="1" value="0" inputmode="numeric" />
        <button type="button" data-action="inc" data-target="${f.key}" aria-label="increase">+</button>
      </div>
    `;
    statsGrid.appendChild(wrap);
  });

  statsGrid.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const input = document.getElementById(btn.dataset.target);
    let val = parseInt(input.value, 10);
    if (isNaN(val)) val = 0;
    if (btn.dataset.action === "inc") val += 1;
    if (btn.dataset.action === "dec") val = Math.max(0, val - 1);
    input.value = val;
  });

  const form = document.getElementById("eosForm");
  const nameInput = document.getElementById("repName");
  const nameError = document.getElementById("nameError");
  const dateInput = document.getElementById("shiftDate");
  const dateError = document.getElementById("dateError");
  const confirmPanel = document.getElementById("confirmPanel");

  const reviewModal = document.getElementById("reviewModal");
  const reviewName = document.getElementById("reviewName");
  const reviewTable = document.getElementById("reviewTable");
  const modalSubmitError = document.getElementById("modalSubmitError");
  const goBackBtn = document.getElementById("goBackBtn");
  const confirmSubmitBtn = document.getElementById("confirmSubmitBtn");
  const submitSpinner = document.getElementById("submitSpinner");
  const submitBtnText = document.getElementById("submitBtnText");

  function todayISODate(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDateDisplay(iso){
    const [y, m, day] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, day);
    return dt.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }

  dateInput.value = todayISODate();

  function saveToLocalHistory(report) {
    try {
      const log = JSON.parse(localStorage.getItem("alohaMaidsEOSLog") || "[]");
      log.push(report);
      localStorage.setItem("alohaMaidsEOSLog", JSON.stringify(log));
    } catch (err) {
      console.warn("Could not save to local history", err);
    }
  }

  let pendingReport = null;

  form.addEventListener("submit", function(e){
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) {
      nameError.style.display = "block";
      nameInput.focus();
      return;
    }
    nameError.style.display = "none";

    const shiftDate = dateInput.value;
    if (!shiftDate) {
      dateError.style.display = "block";
      dateInput.focus();
      return;
    }
    dateError.style.display = "none";

    const values = {};
    FIELDS.forEach(f => {
      values[f.key] = parseInt(document.getElementById(f.key).value, 10) || 0;
    });

    pendingReport = {
      name,
      shiftDate,
      timestamp: new Date().toISOString(),
      values
    };

    openReviewModal(pendingReport);
  });

  function openReviewModal(report){
    reviewName.textContent = `${report.name} · ${formatDateDisplay(report.shiftDate)}`;
    reviewTable.innerHTML = "";
    FIELDS.forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${f.label}</td><td>${report.values[f.key]}</td>`;
      reviewTable.appendChild(tr);
    });
    modalSubmitError.style.display = "none";
    reviewModal.style.display = "flex";
  }

  goBackBtn.addEventListener("click", () => {
    reviewModal.style.display = "none";
  });

  confirmSubmitBtn.addEventListener("click", async () => {
    if (!pendingReport) return;
    modalSubmitError.style.display = "none";
    confirmSubmitBtn.disabled = true;
    submitSpinner.style.display = "inline-block";
    submitBtnText.textContent = "Submitting...";

    try {
      const resp = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(pendingReport)
      });

      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || "Failed to submit report.");
      }

      saveToLocalHistory(pendingReport);
      reviewModal.style.display = "none";
      renderThankYou();
    } catch (err) {
      console.error(err);
      saveToLocalHistory(pendingReport);
      modalSubmitError.textContent = "Could not reach the server, but your report was saved on this device. Please tell your manager or try again shortly.";
      modalSubmitError.style.display = "block";
    } finally {
      confirmSubmitBtn.disabled = false;
      submitSpinner.style.display = "none";
      submitBtnText.textContent = "Submit";
    }
  });

  function renderThankYou(){
    form.style.display = "none";
    confirmPanel.style.display = "block";
  }

  document.getElementById("newReportBtn").addEventListener("click", () => {
    form.reset();
    FIELDS.forEach(f => document.getElementById(f.key).value = 0);
    dateInput.value = todayISODate();
    nameError.style.display = "none";
    dateError.style.display = "none";
    pendingReport = null;
    confirmPanel.style.display = "none";
    form.style.display = "block";
    nameInput.focus();
  });
</script>

</body>
</html>
